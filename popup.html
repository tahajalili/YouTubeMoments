<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; max-height: 520px; margin: 0; padding: 10px; font: 13px/1.4 system-ui, sans-serif; background: #1f1f1f; color: #f1f1f1; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 8px; background: #121212; color: inherit; border: 1px solid #3f3f3f; border-radius: 8px; }
    h3 { margin: 10px 0 2px; font-size: 13px; }
    a { color: #3ea6ff; text-decoration: none; }
    .note { padding: 2px 0; }
    .empty { color: #888; }
    .foot { margin: 12px 0 0; padding-top: 8px; border-top: 1px solid #3f3f3f; font-size: 11px; text-align: center; }
  </style>
</head>
<body>
  <input id="q" placeholder="Search notes…" autofocus>
  <div id="out"></div>
  <p class="foot"><a href="https://github.com/tahajalili" target="_blank">github.com/tahajalili</a></p>
  <script src="popup.js"></script>
</body>
</html>
